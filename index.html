<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Haripriya ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Arial',sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
position:relative;
}

.card{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
text-align:center;
max-width:90%;
animation:bounce 2s infinite;
z-index:10;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

h1{
color:#ff4081;
margin-bottom:15px;
font-size:28px;
}

p{
font-size:18px;
margin-bottom:25px;
}

button{
padding:12px 24px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
transition:.3s;
}

#yesBtn{
background:#4CAF50;
color:white;
}

#yesBtn:hover{
transform:scale(1.1);
}

#noBtn{
background:#ff4d6d;
color:white;
position:absolute;
}

#message{
margin-top:20px;
font-size:24px;
font-weight:bold;
color:#ff4081;
}

.heart{
position:absolute;
bottom:-50px;
font-size:24px;
animation:floatUp linear infinite;
opacity:0.7;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">
<h1>Hey Komal ❤️</h1>

<p>Would you like to go on a date with me? 🌹</p>

<button id="yesBtn">Yes 😍</button>
<button id="noBtn">No 🙈</button>

<div id="message"></div>
</div>

<!-- Add your own music file -->
<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

// Music starts on first click
document.body.addEventListener('click',()=>{
const music=document.getElementById('bgMusic');
music.play().catch(()=>{});
},{once:true});

const noBtn=document.getElementById("noBtn");

function moveButton(){
const maxX=window.innerWidth-120;
const maxY=window.innerHeight-80;

noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

// Floating hearts
function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);
}

setInterval(createHeart,300);

// Confetti
function confettiBurst(){

for(let i=0;i<120;i++){

const conf=document.createElement("div");

conf.innerHTML=["🎉","💖","✨","💕","🌸"][Math.floor(Math.random()*5)];

conf.style.position="fixed";
conf.style.left=Math.random()*100+"vw";
conf.style.top="-20px";
conf.style.fontSize=(Math.random()*20+20)+"px";
conf.style.zIndex="999";

document.body.appendChild(conf);

const duration=Math.random()*3000+2000;

conf.animate([
{transform:'translateY(0px) rotate(0deg)'},
{transform:`translateY(${window.innerHeight+100}px) rotate(720deg)`}
],{
duration:duration
});

setTimeout(()=>conf.remove(),duration);
}
}

document.getElementById("yesBtn").addEventListener("click",()=>{

confettiBurst();

document.getElementById("message").innerHTML=
"🎉 Yay Haripriya! It's a date! ❤️🌹";

document.getElementById("yesBtn").style.display="none";
document.getElementById("noBtn").style.display="none";
});

</script>

</body>
</html>
